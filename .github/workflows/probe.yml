name: probe-reservation-site

on:
  workflow_dispatch:
    inputs:
      site:
        description: "調査対象の予約サイト"
        required: false
        default: "tablecheck"
        type: choice
        options:
          - tablecheck
          - omakase
      target:
        description: "店舗の識別子 (TableCheck: slug / OMAKASE: restaurant id)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe TableCheck
        if: ${{ inputs.site != 'omakase' }}
        run: python scripts/probe_api.py "${{ inputs.target || 'joelrobuchon' }}"

      - name: Probe OMAKASE
        if: ${{ inputs.site == 'omakase' }}
        run: python scripts/probe_omakase.py "${{ inputs.target || 'qt951856' }}"
