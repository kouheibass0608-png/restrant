name: check-availability

on:
  schedule:
    # 10分ごと。public リポジトリでは標準ランナーの実行時間が無制限なため
    # この間隔で運用できる (private の無料枠 月2,000分では超過するので注意)。
    # cron の下限は5分だが、GitHub 側の遅延で実際の間隔は伸びることがある。
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: false
        default: "check"
        type: choice
        options:
          - check
          - dry-run
          - test-notify

permissions:
  contents: write

concurrency:
  group: check-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          MODE="${{ inputs.mode || 'check' }}"
          case "$MODE" in
            test-notify) python -m tablecheck_watcher test-notify ;;
            dry-run)     python -m tablecheck_watcher check --dry-run ;;
            *)           python -m tablecheck_watcher check ;;
          esac
      - name: Persist state
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'check' }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update availability state"
            n=0
            until git push; do
              n=$((n+1))
              [ "$n" -ge 3 ] && exit 1
              git pull --rebase
              sleep 2
            done
          fi
