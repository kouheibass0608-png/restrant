name: check-losier

on:
  schedule:
    # ロブションの5分境界を避け、ジョブ内では15分ごとに確認する。
    - cron: "2 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード (手動実行は1回だけ実行し、ループしません)"
        required: false
        default: "check"
        type: choice
        options:
          - check
          - dry-run
          - test-notify
          - loop-test

env:
  CHECK_INTERVAL: 900 # 通常時は15分間隔
  RATE_LIMIT_BACKOFF: 1800 # HTTP 429時は30分休止
  LOOP_MINUTES: 110

permissions:
  contents: write

concurrency:
  group: check-losier-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test notification
        if: ${{ inputs.mode == 'test-notify' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: >-
          python -m tablecheck_watcher test-notify
          --config config.losier.toml --state state.losier.json

      - name: Dry run
        if: ${{ inputs.mode == 'dry-run' }}
        run: >-
          python -m tablecheck_watcher check --dry-run
          --config config.losier.toml --state state.losier.json

      - name: Check once
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          status=0
          python -m tablecheck_watcher check --config config.losier.toml --state state.losier.json || status=$?
          "${GITHUB_WORKSPACE}/scripts/persist_state.sh" state.losier.json
          exit "$status"

      - name: Watch L'Osier
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'loop-test' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "loop-test" ]; then
            CHECK_INTERVAL=60
            LOOP_MINUTES=3
            echo "loop-test: ${CHECK_INTERVAL}秒間隔 / ${LOOP_MINUTES}分間"
          fi
          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          n=0
          while :; do
            n=$((n + 1))
            echo "--- L'Osier check #${n} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST') ---"
            status=0
            if python -m tablecheck_watcher check --config config.losier.toml --state state.losier.json; then
              :
            else
              status=$?
            fi

            delay=$CHECK_INTERVAL
            if [ "$status" -eq 75 ]; then
              delay=$RATE_LIMIT_BACKOFF
              echo "::warning::HTTP 429: ${delay}秒バックオフします"
            elif [ "$status" -ne 0 ]; then
              echo "::warning::check failed (status=${status}; 継続します)"
            fi

            "${GITHUB_WORKSPACE}/scripts/persist_state.sh" state.losier.json
            if [ $(( $(date +%s) + delay )) -ge "$deadline" ]; then
              echo "ループ終了 (${n}回チェック)。次の定期実行に引き継ぎます。"
              break
            fi
            sleep "$delay"
          done
