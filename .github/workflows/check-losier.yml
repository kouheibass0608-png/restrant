name: check-losier (paused)

on:
  # このファイルをmainへ反映した直後だけ起動し、実行中の定期監視を停止する。
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-losier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 稼働中の旧scheduleジョブと同じグループで起動し、直ちに置き換える。
  group: check-losier-schedule
  cancel-in-progress: true

jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Monitoring paused
        run: echo "L'Osier monitoring is paused; no availability check was performed."
