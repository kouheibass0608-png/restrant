name: probe-ginzan (diagnostics)

on:
  push:
    branches:
      - main
    paths:
      - "scripts/probe_ginzan.py"
      - ".github/workflows/probe-ginzan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Probe booking pages (read only, no notification)
        run: python scripts/probe_ginzan.py
