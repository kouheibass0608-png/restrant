name: check-ginzan-onsen

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # 15分おき（GitHub Actionsの起動時刻は保証されません）
  push:
    branches: [main]
    paths:
      - "ginzan_watcher.py"
      - "tests/test_ginzan.py"
      - ".github/workflows/check-ginzan.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run / test-notify / check"
        type: choice
        options: [dry-run, test-notify, check]
        default: dry-run

permissions:
  contents: write

concurrency:
  group: ginzan-monitor-schedule
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Ginzan unit tests
        run: python -m unittest discover -s tests -p "test_ginzan.py" -v
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check December 13 hotel availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          RUN_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'check' || inputs.mode }}
        run: python ginzan_watcher.py "$RUN_MODE"
      - name: Persist availability state
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'check'
        run: |
          if [ -z "$(git status --porcelain -- state.ginzan.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.ginzan.json
          git commit -m "chore: update Ginzan Dec 13 availability state"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep "$i"
          done
          echo "::warning::Availability state push failed (potential duplicate notifications)"
          exit 0
      - name: Notify if Ginzan workflow failed
        if: ${{ failure() }}
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from tablecheck_watcher.config import NtfyConfig
          from tablecheck_watcher.notify import send_ntfy
          topic = os.getenv("NTFY_TOPIC", "")
          if topic:
              send_ntfy(
                  NtfyConfig(
                      server=os.getenv("NTFY_SERVER") or "https://ntfy.sh",
                      topic=topic,
                      token=os.getenv("NTFY_TOKEN") or "",
                  ),
                  "銀山温泉 監視の実行失敗",
                  "12/13の空室監視が正常終了しませんでした。予約サイトを確認できていない可能性があります。GitHub Actionsのログをご確認ください。",
                  click=os.environ["WORKFLOW_URL"],
                  priority=4,
                  tags=["warning", "hotel"],
              )
          else:
              print("NTFY_TOPIC is not configured; failed run cannot send notification.")
          PY
